[package]
name = "qy-computer-host"
# 这一行与 Cargo.lock 里本 crate 的 version 由 `scripts/sync-version.ts` 按仓库根
# `VERSION` 一起灌入，不要手改：只改其中一处，带 `--locked` 的检查、测试与构建全部失败。
version = "0.1.17"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 版本跟 apps/desktop/src-tauri 的那份对齐（0.61）。两个 crate 各自独立编译，
# 版本分叉不会报错，但同一套 Win32 类型会有两份定义，共享代码时对不上。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  # IUIAutomation 及控件模式接口。
  "Win32_UI_Accessibility",
  # CoInitializeEx / CoCreateInstance。
  "Win32_System_Com",
  # RuntimeId 是 SAFEARRAY，读它的函数在 Ole 下。
  "Win32_System_Ole",
  # 缓存属性按 VARIANT 交回，RuntimeId 那一项要从里面取 SAFEARRAY。
  "Win32_System_Variant",
  # 窗口枚举、标题、类名与所属进程。
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 单文件体积优先：这个二进制随安装包分发。
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
