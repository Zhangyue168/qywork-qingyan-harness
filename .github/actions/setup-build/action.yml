name: Set up qywork build
description: 装 Bun 与 Rust、装依赖、核对版本清单、编译两个外部二进制。CI 与发布共用同一份。

# 第三方 action 的 pin 与外部二进制的编译时机只写在这里。两个工作流各抄一遍的话，
# 改了 pin 只改一处的表现是「一条工作流用新版本、另一条用旧版本」，而两边都是绿的。

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install dependencies
      shell: pwsh
      run: bun install --frozen-lockfile

    - name: Check version manifests
      shell: pwsh
      run: bun run scripts/sync-version.ts --check

    # 这两步必须在 `bun run gate` 之前。gate 里的 cargo check 会跑 tauri 的构建脚本，
    # 而 tauri.conf.json 把 bin/qy 与 bin/qy-computer-host 都声明成 externalBin：
    # 干净 runner 上这些文件不存在，构建脚本报
    # `resource path bin\qy-... doesn't exist` 并以 101 退出。
    - name: Build sidecar
      shell: pwsh
      run: bun run build:agent

    - name: Build computer-host
      shell: pwsh
      run: bun run build:computer-host
