name: CI

# 日常门禁：每次分支 push 与每个 pull request 都跑一遍完整的 `bun run gate` 加 Web 构建。
# 发布工作流只在手动触发时跑，它的绿灯不能替日常提交作证。
#
# 三端同跑：安装包要出 Windows、macOS 与 Linux 三种，而 gate 里的 cargo check 按运行平台
# 选分支、两个 externalBin 按运行平台的三元组编译。只跑一端时，另外两端的编译错误要到
# 发布当天才暴露。前置步骤与发布工作流共用 .github/actions/setup-build，不在这里另抄一份。

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# 同一分支/PR 上新的一次推送取消旧的这条。group 名与发布工作流的 windows-release
# 不重合——重合会让一次 push 取消正在出安装包的那次发布。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 三端都是冷编译，没有 Rust 缓存；Windows 一端原本按 45 分钟走，另两端更慢。
    timeout-minutes: 60
    strategy:
      # 一端红了仍要看到另外两端是不是同一处原因，所以不提前取消同批的其余 job。
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Run gate
        run: bun run gate

      - name: Build web
        run: bun run build:web
